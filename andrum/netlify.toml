# Netlify: sätt "Base directory" till andrum i Netlifys inställningar.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Service workern ska alltid hämtas färsk så att uppdateringar hittas.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Filer med hash i namnet ändras aldrig.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
