[project]
name = "innebandy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "boto3>=1.35",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "psycopg[binary]>=3.2", "moto[server]>=5"]
modal = ["modal>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["api", "worker"]
testpaths = ["worker/tests", "api/tests", "supabase/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Dependencies only; code runs from api/ and worker/ via PYTHONPATH (see scripts/dev_api.sh).
packages = []
